<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serpentine — habitat lab</title>
    <style>
      /*
        A dev-only page. Vite serves any .html at the project root, so this needs no config and
        does not affect the real game at index.html. Styled inline rather than off theme.css on
        purpose: the lab must still boot when the app's CSS is mid-edit.
      */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0910;
        color: #f2eef7;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.6rem 0.9rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: #14101d;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .toolbar button {
        font: inherit;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.05);
        color: #f2eef7;
        cursor: pointer;
      }
      .toolbar button.on {
        background: #b14dff;
        border-color: #b14dff;
      }
      .status {
        margin-left: auto;
        font-size: 0.78rem;
        color: #a79db8;
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(540px, max-content));
        gap: 1.2rem;
        padding: 1.2rem;
        align-items: start;
      }
      figure {
        margin: 0;
      }
      canvas {
        display: block;
        border-radius: 10px;
      }
      figcaption {
        font-size: 0.8rem;
        color: #a79db8;
        padding-top: 0.5rem;
        max-width: 520px;
        line-height: 1.45;
      }
      figcaption strong {
        color: #f2eef7;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="lab"></div>
    <script type="module" src="/src/habitat/lab/main.ts"></script>
  </body>
</html>
